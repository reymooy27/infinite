server {
    listen 9871;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Cache static assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API ke backend container
    # ponytail: 3600s read timeout for synchronous LLM turns (opencode message POST);
    # upgrade path is async job endpoints if opencode ever moves off sync POST.
    location /api/ {
        proxy_pass http://127.0.0.1:7891;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE (/proxy/event) must not be buffered
        proxy_buffering off;
    }

    # Proxy WebSocket ke backend container
    location /ws/ {
        proxy_pass http://127.0.0.1:7891;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }
}
