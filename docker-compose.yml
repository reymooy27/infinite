services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9871:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "7891:7891"
    env_file: .env
    volumes:
      - infinite-data:/data
    restart: unless-stopped

volumes:
  infinite-data:
